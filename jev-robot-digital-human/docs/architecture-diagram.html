<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jev 数字人决策系统 · 架构设计示意图</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0f17; }
  body { display: flex; justify-content: center; }
  svg { max-width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<svg viewBox="0 0 1440 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <!-- 箭头标记：按线色分组 -->
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1440" height="1000" fill="#0b0f17"/>
  <text x="720" y="42" text-anchor="middle" fill="#e2e8f0" font-size="24" font-weight="700">Jev 数字人决策系统 · 架构设计示意图</text>
  <text x="720" y="68" text-anchor="middle" fill="#94a3b8" font-size="13">架构定位：Jev 快决策 = 外层循环（宿主，永续 ~3.2s） · 慢思考（Pi）= 内层循环（消息触发） · 一切行为统一回流外层状态</text>

  <!-- ═══════════ 大分区框 ═══════════ -->
  <rect x="40" y="95" width="975" height="690" rx="14" fill="#111a2b" stroke="#2a3b54" stroke-width="1.5"/>
  <text x="60" y="120" fill="#7dd3fc" font-size="14" font-weight="700">浏览器（客户端）</text>

  <rect x="1055" y="95" width="345" height="690" rx="14" fill="#171226" stroke="#4a3b6a" stroke-width="1.5"/>
  <text x="1075" y="120" fill="#c4b5fd" font-size="14" font-weight="700">服务端（Vite 中间件 · Node）</text>

  <!-- ═══════════ 浏览器：对话层 / UI 层 ═══════════ -->
  <g>
    <rect x="75" y="145" width="420" height="105" rx="10" fill="#0e1729" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="95" y="172" fill="#e2e8f0" font-size="15" font-weight="700">对话层 · ui/chat.ts</text>
    <text x="95" y="196" fill="#94a3b8" font-size="12.5">用户消息 ⇄ Jev 消息响应打分（noul 并行）</text>
    <text x="95" y="216" fill="#94a3b8" font-size="12.5">SSE 流式气泡：逐字显示 · 工具轨迹 · 边说边动</text>
    <text x="95" y="236" fill="#64748b" font-size="12">主交互区（右侧面板）</text>
  </g>
  <g>
    <rect x="545" y="145" width="420" height="105" rx="10" fill="#0e1729" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="565" y="172" fill="#e2e8f0" font-size="15" font-weight="700">UI 层 · ui/panel.ts</text>
    <text x="565" y="196" fill="#94a3b8" font-size="12.5">决策可视化：概率条 / 置信度 / 决策历史</text>
    <text x="565" y="216" fill="#94a3b8" font-size="12.5">感知状态 JSON · 参数设置弹窗 · 数字人切换</text>
    <text x="565" y="236" fill="#64748b" font-size="12">setDecision → cbApply 统一执行入口</text>
  </g>

  <!-- ═══════════ 浏览器：控制层（外层循环宿主） ═══════════ -->
  <g>
    <rect x="75" y="290" width="890" height="300" rx="10" fill="#0d1a26" stroke="#38bdf8" stroke-width="2"/>
    <text x="95" y="318" fill="#7dd3fc" font-size="15" font-weight="700">控制层 · loop.ts (Simulation) —— 外层快决策循环（宿主）</text>
    <text x="95" y="337" fill="#64748b" font-size="12">感知连续 · 决策周期：每 3.2s 一步进，永续运转</text>

    <!-- 循环节点 ×5 -->
    <g font-size="12.5">
      <rect x="105" y="355" width="150" height="64" rx="8" fill="#123047" stroke="#38bdf8"/>
      <text x="180" y="381" text-anchor="middle" fill="#e2e8f0" font-weight="600">① 感知 env</text>
      <text x="180" y="401" text-anchor="middle" fill="#94a3b8" font-size="11">含行为状态</text>

      <rect x="275" y="355" width="150" height="64" rx="8" fill="#123047" stroke="#38bdf8"/>
      <text x="350" y="381" text-anchor="middle" fill="#e2e8f0" font-weight="600">② Jev 决策</text>
      <text x="350" y="401" text-anchor="middle" fill="#94a3b8" font-size="11">decide(env)</text>

      <rect x="445" y="355" width="150" height="64" rx="8" fill="#123047" stroke="#38bdf8"/>
      <text x="520" y="381" text-anchor="middle" fill="#e2e8f0" font-weight="600">③ 置信门控</text>
      <text x="520" y="401" text-anchor="middle" fill="#94a3b8" font-size="11">&lt;0.45 → idle 兜底</text>

      <rect x="615" y="355" width="150" height="64" rx="8" fill="#123047" stroke="#38bdf8"/>
      <text x="690" y="381" text-anchor="middle" fill="#e2e8f0" font-weight="600">④ 执行动作</text>
      <text x="690" y="401" text-anchor="middle" fill="#94a3b8" font-size="11">avatar.setDecision</text>

      <rect x="785" y="355" width="150" height="64" rx="8" fill="#3a2c10" stroke="#fbbf24"/>
      <text x="860" y="381" text-anchor="middle" fill="#e2e8f0" font-weight="600">⑤ 行为回流</text>
      <text x="860" y="401" text-anchor="middle" fill="#94a3b8" font-size="11">noteAction</text>

      <!-- 节点间箭头 -->
      <line x1="255" y1="387" x2="272" y2="387" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-cyan)"/>
      <line x1="425" y1="387" x2="442" y2="387" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-cyan)"/>
      <line x1="595" y1="387" x2="612" y2="387" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-cyan)"/>
      <line x1="765" y1="387" x2="782" y2="387" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-cyan)"/>
      <!-- 回环：⑤ → ① -->
      <path d="M 860 419 L 860 440 L 180 440 L 180 422" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-orange)"/>
      <text x="520" y="435" text-anchor="middle" fill="#fbbf24" font-size="11.5">循环闭合 ~3.2s：下一轮决策基于最新行为状态</text>
    </g>

    <!-- 感知入环 / 行为回流账本 -->
    <g>
      <rect x="105" y="492" width="400" height="76" rx="8" fill="#1c1220" stroke="#f472b6" stroke-width="1.5"/>
      <text x="123" y="515" fill="#f472b6" font-size="13" font-weight="700">感知入环 · perceive()</text>
      <text x="123" y="536" fill="#c7b7c4" font-size="11.5">user_message · agent_action · agent_reply</text>
      <text x="123" y="554" fill="#c7b7c4" font-size="11.5">scene_event → 即时更新 env（感知连续）</text>
    </g>
    <g>
      <rect x="525" y="492" width="420" height="76" rx="8" fill="#241c0d" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="543" y="515" fill="#fbbf24" font-size="13" font-weight="700">行为回流账本 · noteAction()（内/外层统一）</text>
      <text x="543" y="536" fill="#c9bd9d" font-size="11.5">env.currentAction { motion, expression, source, since }</text>
      <text x="543" y="554" fill="#c9bd9d" font-size="11.5">env.recentActions[5] —— "我刚做了什么"决策可见</text>
    </g>
  </g>

  <!-- ═══════════ 浏览器：决策层 / 执行层 ═══════════ -->
  <g>
    <rect x="75" y="630" width="430" height="130" rx="10" fill="#0e1729" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="95" y="657" fill="#e2e8f0" font-size="15" font-weight="700">决策层（System One）· jev/</text>
    <text x="95" y="681" fill="#94a3b8" font-size="12.5">RealJevEngine：真实 TypeSafe Jev（失败上抛）</text>
    <text x="95" y="701" fill="#94a3b8" font-size="12.5">semantics.ts：buildQuestions / buildState / normalize</text>
    <text x="95" y="721" fill="#94a3b8" font-size="12.5">decide + decideMessage（含 reply 打分）</text>
    <text x="95" y="744" fill="#64748b" font-size="11.5">state 注入 currentMotion / actionSource / actionElapsedSec</text>
  </g>
  <g>
    <rect x="535" y="630" width="430" height="130" rx="10" fill="#0e1729" stroke="#34d399" stroke-width="1.5"/>
    <text x="555" y="657" fill="#e2e8f0" font-size="15" font-weight="700">执行层 · avatar/gltf-avatar.ts</text>
    <text x="555" y="681" fill="#94a3b8" font-size="12.5">Three.js 场景 · GLB 数字人（Robot / Xbot）</text>
    <text x="555" y="701" fill="#94a3b8" font-size="12.5">AnimationMixer crossfade 动画切换 · morph 表情</text>
    <text x="555" y="721" fill="#94a3b8" font-size="12.5">按包围盒归一化身高 · 脚底贴地</text>
    <text x="555" y="744" fill="#64748b" font-size="11.5">所有决策（Jev / Pi / 快反射）经同一入口驱动</text>
  </g>

  <!-- ═══════════ 服务端：智能体层（顶部） ═══════════ -->
  <g>
    <rect x="1090" y="145" width="275" height="265" rx="10" fill="#151022" stroke="#a78bfa" stroke-width="2"/>
    <text x="1108" y="172" fill="#c4b5fd" font-size="15" font-weight="700">智能体层 · System Two</text>
    <text x="1108" y="192" fill="#8b7ba8" font-size="12">server/pi-agent-server.ts · tools.ts</text>
    <text x="1108" y="214" fill="#c9c2d8" font-size="12.5">Pi Agent 单例 + DeepSeek</text>
    <text x="1108" y="232" fill="#8b7ba8" font-size="11.5">（.env LLM_API_KEY，请求串行化）</text>
    <text x="1108" y="256" fill="#c4b5fd" font-size="12.5" font-weight="600">机器人工具（第一人称 · 7 个）：</text>
    <text x="1108" y="274" fill="#a99cc4" font-size="11.5">get_robot_state　感知自己</text>
    <text x="1108" y="290" fill="#a99cc4" font-size="11.5">set_robot_intent　立心意</text>
    <text x="1108" y="306" fill="#a99cc4" font-size="11.5">command_robot　直接表演</text>
    <text x="1108" y="322" fill="#a99cc4" font-size="11.5">trigger_scene_event　设想情景</text>
    <text x="1108" y="340" fill="#a99cc4" font-size="11.5">read/write_memory　记忆自管</text>
    <text x="1108" y="356" fill="#a99cc4" font-size="11.5">read_recent_episodes　回顾经历</text>
    <text x="1108" y="378" fill="#c4b5fd" font-size="12.5" font-weight="600">SSE 流式响应：</text>
    <text x="1108" y="396" fill="#a99cc4" font-size="11.5">meta · delta（逐字）· tool · command · done</text>
  </g>

  <!-- ═══════════ 服务端：内层循环说明 ═══════════ -->
  <g>
    <rect x="1090" y="435" width="275" height="112" rx="10" fill="#1a1428" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="1108" y="460" fill="#c4b5fd" font-size="13.5" font-weight="700">内层循环（消息触发）</text>
    <text x="1108" y="482" fill="#a99cc4" font-size="11.5">decideMessage 各动作独立打分</text>
    <text x="1108" y="500" fill="#a99cc4" font-size="11.5">≥0.5 并行执行 · 快反射零 LLM</text>
    <text x="1108" y="518" fill="#a99cc4" font-size="11.5">回复 → 唤醒 Pi（边说边动）</text>
    <text x="1108" y="536" fill="#7c6f96" font-size="11">输出全部回流外层 env</text>
  </g>

  <!-- ═══════════ 服务端：代理层（底部） ═══════════ -->
  <g>
    <rect x="1090" y="585" width="275" height="100" rx="10" fill="#0e1729" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="1108" y="612" fill="#e2e8f0" font-size="15" font-weight="700">代理层 · vite.config.ts</text>
    <text x="1108" y="636" fill="#94a3b8" font-size="12.5">POST /api/systemone</text>
    <text x="1108" y="654" fill="#94a3b8" font-size="12.5">→ api.typesafe.ai（真实 Jev）</text>
    <text x="1108" y="674" fill="#64748b" font-size="11.5">API Key 仅服务端 · 浏览器零接触</text>
  </g>

  <!-- ═══════════ 连接线 ═══════════ -->
  <!-- ① 对话层 → 控制层：user_message 感知入环（粉） -->
  <line x1="285" y1="250" x2="285" y2="287" stroke="#f472b6" stroke-width="2" marker-end="url(#arr-pink)"/>
  <text x="273" y="272" fill="#f472b6" font-size="11.5" text-anchor="end">user_message 感知</text>

  <!-- ② 控制层 → UI 层：决策载荷可视化（青，朝上） -->
  <line x1="755" y1="290" x2="755" y2="253" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-cyan)"/>
  <text x="767" y="272" fill="#7dd3fc" font-size="11.5">onDecision → 可视化</text>

  <!-- ③ 控制层 → 决策层：decide(env)（青） -->
  <line x1="285" y1="590" x2="285" y2="627" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-cyan)"/>
  <text x="240" y="614" fill="#7dd3fc" font-size="11.5" text-anchor="end">decide(env)</text>

  <!-- ④ 决策层 → 控制层：RobotDecision（青虚线返回） -->
  <line x1="330" y1="630" x2="330" y2="593" stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-cyan)"/>
  <text x="342" y="614" fill="#7dd3fc" font-size="11.5">RobotDecision</text>

  <!-- ⑤ 控制层 → 执行层：applied decision（绿） -->
  <line x1="750" y1="590" x2="750" y2="627" stroke="#34d399" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="762" y="614" fill="#34d399" font-size="11.5">applied decision</text>

  <!-- ⑥ 决策层 → 代理层：POST /api/systemone（青，走底部通道） -->
  <path d="M 290 760 L 290 775 L 1035 775 L 1035 635 L 1087 635" fill="none" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr-cyan)"/>
  <text x="660" y="800" fill="#7dd3fc" font-size="11.5">POST /api/systemone（questions + state）</text>

  <!-- ⑦ 对话层 → 智能体层：POST /api/agent/chat（紫，走顶部通道） -->
  <path d="M 400 145 L 400 127 L 1227 127 L 1227 142" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arr-violet)"/>
  <text x="700" y="120" fill="#c4b5fd" font-size="11.5">POST /api/agent/chat {message, env, lastDecision}</text>

  <!-- ⑧ 智能体层 → 对话层：SSE 流式（紫虚线） -->
  <path d="M 1090 255 L 1035 255 L 1035 270 L 330 270 L 330 253" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arr-violet)"/>
  <text x="660" y="264" fill="#c4b5fd" font-size="11.5">SSE 流式返回：meta · delta（逐字）· tool · command（边说边动）· done</text>

  <!-- ⑨ 智能体层 → 控制层：command 指令 → perceive 行为回流（橙） -->
  <path d="M 1090 300 L 1035 300 L 1035 430 L 968 430" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arr-orange)"/>
  <text x="1044" y="372" fill="#fbbf24" font-size="11.5" transform="rotate(-90 1044 372)" text-anchor="middle"> </text>
  <text x="1002" y="420" fill="#fbbf24" font-size="11.5" text-anchor="end">command → perceive(agent_action)</text>

  <!-- ═══════════ 图例 ═══════════ -->
  <g font-size="12.5">
    <rect x="40" y="820" width="1360" height="150" rx="12" fill="#101827" stroke="#1e293b"/>
    <text x="62" y="850" fill="#e2e8f0" font-size="14" font-weight="700">图例</text>

    <circle cx="80" cy="878" r="5" fill="#38bdf8"/><text x="94" y="882" fill="#94a3b8">外层快决策循环（Jev，~3.2s，宿主）</text>
    <circle cx="80" cy="904" r="5" fill="#a78bfa"/><text x="94" y="908" fill="#94a3b8">内层慢思考循环（Pi，消息触发，SSE 流式）</text>
    <circle cx="80" cy="930" r="5" fill="#34d399"/><text x="94" y="934" fill="#94a3b8">执行路径（统一入口）</text>

    <circle cx="500" cy="878" r="5" fill="#fbbf24"/><text x="514" y="882" fill="#94a3b8">行为回流 noteAction（jev-loop / jev-route / pi 三源同一账本）</text>
    <circle cx="500" cy="904" r="5" fill="#f472b6"/><text x="514" y="908" fill="#94a3b8">感知事件 perceive（user_message / agent_action / agent_reply / scene_event）</text>
    <text x="514" y="934" fill="#64748b" font-size="11.5">虚线 = 返回流 / 数据返回</text>

    <!-- 右侧关键机制说明 -->
    <text x="960" y="856" fill="#e2e8f0" font-size="13" font-weight="700">关键机制</text>
    <text x="960" y="880" fill="#94a3b8" font-size="12">· 快慢分工：反射交给 Jev，理解与规划交给 Pi；说话（reply）也是一种动作，独立打分</text>
    <text x="960" y="902" fill="#94a3b8" font-size="12">· 一切刺激皆感知事件：对话、动作、回复、场景事件全部即时写入 env</text>
    <text x="960" y="924" fill="#94a3b8" font-size="12">· 行为状态回环：currentAction 记录"在做什么/做多久/谁发起"，外层决策不打断内层行为</text>
    <text x="960" y="946" fill="#94a3b8" font-size="12">· Key 安全：LLM/Jev API Key 仅存服务端，浏览器经 /api/agent/* 与 /api/systemone 访问</text>
  </g>
</svg>
</body>
</html>
