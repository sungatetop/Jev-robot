<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jev Robot Digital Human — 数字人决策控制模拟</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <h1>Jev · 数字人决策控制模拟</h1>
        <span class="sub">System-One 决策层 → 3D 数字人（运动 + 表情）</span>
      </div>
      <div class="topright">
        <span id="engine-status" class="badge warn">初始化…</span>
        <button id="btn-toggle" class="btn primary">▶ 启动循环</button>
      </div>
    </header>

    <main class="layout">
      <!-- 3D 舞台 -->
      <section class="stage-wrap">
        <div id="stage"></div>
        <div class="stage-hud">
          <div class="hud-block">
            <span class="lbl">当前动作</span>
            <span id="motion-badge" class="pill motion">IDLE</span>
          </div>
          <div class="hud-block">
            <span class="lbl">当前表情</span>
            <span id="expr-badge" class="pill expr">NEUTRAL</span>
          </div>
          <div class="hud-block grown">
            <span class="lbl">强度</span>
            <div class="hudbar"><i id="intensity-bar"></i></div>
          </div>
        </div>
      </section>

      <!-- 控制面板 -->
      <aside class="panel">
        <div class="card">
          <h2>Jev 决策引擎</h2>
          <div class="seg" role="radiogroup">
            <button data-engine="auto" class="active">自动</button>
            <button data-engine="real">真实 Jev</button>
            <button data-engine="local">本地</button>
          </div>
          <p id="engine-warn" class="warn-text"></p>
          <div class="vstack">
            <div class="field">
              <label>决策间隔 <b id="loop-ms-val">3200 ms</b></label>
              <input id="loop-ms" type="range" min="800" max="6000" step="100" value="3200" />
            </div>
            <div class="field">
              <label>置信度门控 <b id="gate-val">0.45</b></label>
              <input id="gate" type="range" min="0" max="95" step="1" value="45" />
            </div>
          </div>
        </div>

        <div class="card">
          <h2>数字人类型 <small>（可切换渲染形态）</small></h2>
          <div class="seg" id="avatar-mode" role="radiogroup">
            <button data-avatar="robot" class="active">真实·机器人</button>
            <button data-avatar="xbot">真实·Xbot</button>
          </div>
          <p id="avatar-info" class="hint">加载中…</p>
        </div>

        <div class="card">
          <h2>骨骼蒙皮 <small>（THREE.Bone + SkinnedMesh）</small></h2>
          <div class="rig-row">
            <label class="toggle">
              <input id="skeleton-toggle" type="checkbox" />
              <span>显示骨骼</span>
            </label>
            <button id="btn-reset-pose" class="btn">↺ 重置绑定姿态</button>
          </div>
          <p class="hint">骨骼可视化(SkeletonHelper) · 播放模型内置 AnimationClip 动画</p>
        </div>

        <div class="card">
          <h2>场景事件 <small>（模拟感知 → 触发决策）</small></h2>
          <div class="events">
            <button data-event="arrival" class="chip">👋 用户走近</button>
            <button data-event="move" class="chip">➡️ 前进</button>
            <button data-event="obstacle" class="chip">⚠️ 障碍物</button>
            <button data-event="direct" class="chip">🧭 指引</button>
            <button data-event="celebrate" class="chip">🎉 庆祝</button>
            <button data-event="uncertain" class="chip">❓ 不确定</button>
            <button data-event="reset" class="chip reset">↺ 恢复</button>
          </div>
        </div>

        <div class="card">
          <h2>本次决策</h2>
          <div class="kv">
            <span>输出引擎</span><b id="engine-emitter">--</b>
            <span>置信度</span><b id="confidence-num">--</b>
            <span>门控判定</span><b id="conf-gate-num">--</b>
            <span>朝向用户</span><div class="mini"><div class="hudbar"><i id="look-bar"></i></div></div>
          </div>
          <div id="prob-bars" class="probs"></div>
        </div>

        <div class="card">
          <h2>决策历史</h2>
          <ul id="history-list" class="history"></ul>
        </div>

        <div class="card">
          <h2>感知状态 state</h2>
          <pre id="state-json" class="state">{}</pre>
        </div>
      </aside>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
